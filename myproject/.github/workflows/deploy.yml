name: Run Python App

# Trigger workflow on push to master branch
on:
  push:
    branches:
      - master
  workflow_dispatch:   # optional: allows manual run from Actions tab

jobs:
  run-app:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout the repo
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Setup Python
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      # 3. Install dependencies if requirements.txt exists
      - name: Install dependencies
        run: |
          if [ -f requirements.txt ]; then pip install -r requirements.txt; else echo "No requirements.txt found"; fi

      # 4. Run Python program
      - name: Run Python program
        run: python what.py


